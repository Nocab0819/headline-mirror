<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>頭條！鏡中人 HEADLINE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--cream:#F7EAD0;--paper:#FFF8E8;--ink:#161616;--red:#E23B2E;--yel:#FFD23F;--blue:#2E6FD8;--sky:#7CC6F0;--green:#2C9A55;
 --zh:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--comic:'Bangers','Noto Sans TC',Impact,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--zh);color:var(--ink);background:var(--cream);
 background-image:radial-gradient(circle,rgba(226,59,46,.16) 1.3px,transparent 1.8px);background-size:12px 12px;overflow-x:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.box{background:var(--paper);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink)}
.sfx{font-family:var(--comic);color:var(--yel);letter-spacing:2px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.cap{background:var(--yel);border:3px solid var(--ink);padding:6px 12px;font-weight:900;display:inline-block}
.bubble{position:relative;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:14px 18px;font-weight:700}
.bubble:after{content:"";position:absolute;left:34px;bottom:-24px;border:12px solid transparent;border-top:16px solid var(--ink)}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:900;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 22px;font-size:20px;transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.y{background:var(--yel);color:var(--ink)}
.btn.w{background:#fff;color:var(--ink)}
.btn[disabled]{opacity:.35;pointer-events:none}
.stamp{display:inline-flex;align-items:center;justify-content:center;font-weight:900;border:4px solid currentColor;border-radius:50%;transform:rotate(-12deg);background:rgba(255,255,255,.85)}
.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.flip{animation:flip .6s cubic-bezier(.3,1.3,.5,1) both}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}}

/* ================= HOST ================= */
#host{display:none;height:100vh;flex-direction:column;padding:18px 26px 14px;gap:14px}
.hhead{display:flex;align-items:center;gap:18px}
.logo{font-family:var(--comic);font-size:46px;line-height:1;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.logo small{font-family:var(--zh);font-weight:900;font-size:22px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;margin-left:6px}
.yearchip{font-family:var(--comic);font-size:40px;background:var(--ink);color:var(--yel);padding:2px 16px;transform:rotate(-3deg)}
.phase{font-weight:900;font-size:22px;background:#fff;border:3px solid var(--ink);padding:6px 14px}
.hspace{flex:1}
.timer{font-family:var(--comic);font-size:44px;min-width:110px;text-align:center}
.timer.low{color:var(--red)}
.hmain{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.hfoot{display:flex;gap:12px;align-items:stretch}
.gchip{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:18px;cursor:pointer;min-width:0}
.gchip .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);flex:none}
.gchip .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchip .st{font-family:var(--comic);font-size:22px}
.gchip.ok{background:var(--yel)}
.gchip.off{opacity:.5}
.gchip .sc{font-family:var(--comic);font-size:26px}
.panels{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:20px;flex:1;min-height:0}
.panel{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.panel:nth-child(1){background:#CFEAFB radial-gradient(circle,rgba(46,111,216,.22) 1.6px,transparent 2.2px) 0 0/14px 14px}
.panel:nth-child(3){background:#FFE9A8 radial-gradient(circle,rgba(226,59,46,.25) 1.8px,transparent 2.4px) 0 0/14px 14px}
.panel .cap{position:absolute;left:-4px;top:-4px;font-size:22px;max-width:92%;text-align:left;line-height:1.4}
.panel .art{width:46%;max-width:220px}
.panel .bubble{font-size:26px;line-height:1.45;max-width:94%}
.panel .who{margin-top:30px;font-weight:900;font-size:20px}
.panel .big{font-size:110px;line-height:1}
.panel .foot{position:absolute;left:auto;top:auto;right:-4px;bottom:-4px;font-size:20px;text-align:left;max-width:88%}
.art svg,.act svg{width:100%;height:auto;display:block}
.newsmini{background:#EDE3CC;border:3px solid var(--ink);padding:14px 18px;transform:rotate(-2deg);max-width:94%}
.newsmini b{display:block;font-size:14px;letter-spacing:4px;border-bottom:3px double var(--ink);padding-bottom:4px;margin-bottom:8px}
.newsmini div{font-weight:900;font-size:34px;line-height:1.25}
.lobby{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;flex:1;min-height:0}
.lobby .qrbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#qr{background:#fff;padding:12px;border:4px solid var(--ink)}
#qr img,#qr canvas{display:block;width:300px;height:300px}
.url{font-weight:900;font-size:18px;word-break:break-all;text-align:center}
.rules{padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.rules h2{font-family:var(--comic);font-size:44px;color:var(--blue);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;letter-spacing:1px}
.rules .r{display:flex;gap:14px;align-items:flex-start;font-size:21px;font-weight:700;line-height:1.45}
.rules .r i{font-style:normal;font-family:var(--comic);font-size:30px;background:var(--red);color:#fff;border:3px solid var(--ink);width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.stamps{display:flex;gap:12px;flex-wrap:wrap}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.center h1{font-size:54px;font-weight:900;line-height:1.25}
.center p{font-size:24px;font-weight:700}
.grid{display:grid;gap:18px;flex:1;min-height:0}
.card{display:flex;flex-direction:column;align-items:center;padding:14px 12px 16px;text-align:center;position:relative;min-height:0}
.card .dept{font-weight:900;font-size:20px;color:#fff;border:3px solid var(--ink);padding:3px 12px;margin-top:-30px;margin-bottom:6px}
.card .art{width:56%;max-width:150px}
.card .t{font-weight:900;font-size:24px;line-height:1.3;margin-top:6px}
.card .bam{position:absolute;right:-14px;top:-22px;font-size:40px;transform:rotate(12deg)}
.mirrorstage{flex:1;display:grid;grid-template-columns:1fr 1.2fr;gap:30px;min-height:0;align-items:center}
.mleft{display:flex;flex-direction:column;align-items:center;gap:12px}
.mright{display:flex;flex-direction:column;gap:16px}
.headline{background:#EDE3CC;border:4px solid var(--ink);padding:16px 22px;box-shadow:7px 7px 0 var(--ink);transform:rotate(-1.5deg)}
.headline .mast{display:flex;justify-content:space-between;border-bottom:4px double var(--ink);padding-bottom:4px;font-weight:900;letter-spacing:4px}
.headline .hl{font-weight:900;font-size:44px;line-height:1.2;margin-top:8px}
.tally{display:flex;gap:14px;align-items:flex-end}
.tally .col{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900}
.tally .bar{width:70px;background:var(--ink);border:3px solid var(--ink)}
.verdict{font-size:26px;font-weight:900;line-height:1.45}
.board{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center;max-width:1100px;margin:0 auto;width:100%}
.brow{display:flex;align-items:center;gap:18px;padding:10px 18px;font-size:24px;font-weight:900}
.brow .rk{font-family:var(--comic);font-size:44px;width:60px}
.brow .nm{flex:1}
.brow .pts{font-family:var(--comic);font-size:46px}
.brow .sub{font-size:16px;font-weight:700;color:#444}
table.truth{width:100%;border-collapse:collapse;font-size:21px;background:var(--paper)}
table.truth td,table.truth th{border:3px solid var(--ink);padding:10px 14px;text-align:left;vertical-align:top}
table.truth th{background:var(--ink);color:var(--yel);font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{padding:22px;max-width:760px;width:92%;max-height:90vh;overflow:auto}
.ctrl{display:flex;gap:12px;align-items:center}
.tiny{font-size:14px;font-weight:700;color:#555}

/* ================= PLAYER ================= */
#player{display:none;max-width:480px;margin:0 auto;min-height:100vh;flex-direction:column;padding:14px 16px 28px}
.ptop{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-weight:900;font-size:20px}
.ptop .yr{margin-left:auto;font-family:var(--comic);font-size:28px;color:var(--yel);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.pbody{flex:1;display:flex;flex-direction:column;gap:14px;margin-top:18px}
.pbody h2{font-size:24px;font-weight:900;line-height:1.35}
.lookup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.lookup .sfx{font-size:64px}
.lookup p{font-weight:700;font-size:18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);text-align:center;font-weight:900;font-size:16px;line-height:1.3}
.act svg{width:62%;max-width:90px}
.act small{font-weight:700;font-size:12px;color:#555}
.act.sel{background:var(--yel);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stbtn{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:20px}
.stbtn.sel{background:var(--yel);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.stbtn .ic{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);flex:none}
.target{padding:12px;display:flex;flex-direction:column;gap:10px}
.target .tt{display:flex;align-items:center;gap:10px;font-weight:900}
.target .tt svg{width:54px;height:54px;flex:none}
.target .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.target .mini button{border:3px solid var(--ink);background:#fff;font-weight:900;font-size:16px;padding:8px 0}
.target .mini button.sel{color:#fff}
.res{padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.res .sfx{font-size:56px}
.pnote{font-size:13px;color:#555;font-weight:700;text-align:center}
.conn{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:6px 12px;font-weight:700;display:none;z-index:60}
</style>
</head>

function HostNet(room,onMsg,onClose,onReady){
 if(LOCAL){const bc=new BroadcastChannel("hm-"+room);
   bc.onmessage=e=>{const m=e.data;if(m.to!=="host")return;if(m.data.t==="bye")onClose(m.from);else onMsg(m.from,m.data)};
   setTimeout(onReady,0);return {send:(id,d)=>bc.postMessage({to:id,data:d})}}
 const conns={};let peer;
 function start(tries=0){
   peer=new Peer(PEER_PREFIX+room,PEER_OPTS);
   peer.on("open",()=>{connNote("");onReady()});
   peer.on("connection",c=>{c.on("open",()=>{conns[c.peer]=c});c.on("data",d=>{conns[c.peer]=c;onMsg(c.peer,d)});c.on("close",()=>{delete conns[c.peer];onClose(c.peer)});c.on("error",()=>{})});
   peer.on("disconnected",()=>{connNote("重新連線中…");setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
   peer.on("error",e=>{if(e.type==="unavailable-id"&&tries<10){connNote("房間代碼被占用，重試中…");peer.destroy();setTimeout(()=>start(tries+1),2500)}
     else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){connNote("連線伺服器不穩，可用畫面下方「代打」繼續")}});
 }
 if(typeof Peer==="undefined"){connNote("無法載入連線元件（沒有網路？）。可在大廳新增組別，用「代打」進行。");setTimeout(onReady,0);return {send:()=>{}}}
 start();
 return {send:(id,d)=>{const c=conns[id];if(c&&c.open)try{c.send(d)}catch(e){}}};
}
function ClientNet(room,onMsg,onStatus){
 if(LOCAL){const me="c"+Math.random().toString(36).slice(2,8);const bc=new BroadcastChannel("hm-"+room);
   bc.onmessage=e=>{if(e.data.to===me)onMsg(e.data.data)};
   const api={send:d=>bc.postMessage({to:"host",from:me,data:d})};setTimeout(()=>onStatus("open"),0);
   addEventListener("pagehide",()=>api.send({t:"bye"}));return api}
 let peer,conn,alive=false;
 function connect(){
   if(!peer||peer.destroyed){peer=new Peer(PEER_OPTS);peer.on("open",dial);peer.on("error",e=>{onStatus("err");if(e.type==="peer-unavailable")setTimeout(dial,2500)});peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}})}
   else dial()}
 function dial(){
   conn=peer.connect(PEER_PREFIX+room,{reliable:true});
   conn.on("open",()=>{alive=true;onStatus("open")});
   conn.on("data",onMsg);
   conn.on("close",()=>{alive=false;onStatus("lost");setTimeout(dial,2000)});
   conn.on("error",()=>{});
   setTimeout(()=>{if(!alive){try{conn.close()}catch(e){}}},8000)}
 if(typeof Peer==="undefined"){setTimeout(()=>onStatus("nolib"),0);return {send:()=>{}}}
 connect();
 setInterval(()=>{if(!alive&&peer&&peer.open)dial()},6000);
 return {send:d=>{if(conn&&conn.open)try{conn.send(d)}catch(e){}}};
}

function hSave(){try{localStorage.setItem(HKEY,JSON.stringify(H))}catch(e){}}
function hLoad(){try{return JSON.parse(localStorage.getItem(HKEY))}catch(e){return null}}
function G(id){return H.groups.find(g=>g.id===id)}
function startHost(){
 document.getElementById("host").style.display="flex";
 H=hLoad()||hNew();if(Q.has("new"))H=hNew();
 H.groups.forEach(g=>g.online=false);hSave();
 net=HostNet(H.room,onHostMsg,id=>{const g=H.groups.find(g=>connOf[g.id]===id);if(g){g.online=false;delete connOf[g.id];hRender()}},()=>hRender());
 hRender();
 tick=setInterval(()=>{const el=document.getElementById("tmr");if(!el)return;const s=Math.max(0,Math.ceil((H.timerEnd-Date.now())/1000));el.textContent=s?s:"時間到";el.classList.toggle("low",s<=10)},500);
}
function onHostMsg(id,m){
 if(m.t==="hello"){let g=m.gid&&G(m.gid);
   if(m.claim){g=G(m.claim)}
   if(!g){if(H.phase!=="lobby"){const off=H.groups.filter(x=>!x.online||!connOf[x.id]);
       if(off.length)net.send(id,{t:"pick",options:off.map(x=>({id:x.id,name:x.name,color:x.color}))});
       else net.send(id,{t:"full",msg:"遊戲已經開始了，請和隔壁組一起玩。"});return}
     if(H.groups.length>=DEPTS.length){net.send(id,{t:"full",msg:"已經滿 6 組了，請和其他組一起玩。"});return}
     const d=DEPTS.find(d=>!H.groups.some(g=>g.name===d.n));g={id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name:d.n,color:d.c,online:true};H.groups.push(g)}
   g.online=true;Object.keys(connOf).forEach(k=>{if(connOf[k]===id)delete connOf[k]});connOf[g.id]=id;
   net.send(id,{t:"welcome",gid:g.id});hSave();hRender();return}
 const g=H.groups.find(g=>connOf[g.id]===id);if(!g)return;
 if(m.t==="act"&&H.phase==="act"&&m.r===H.r){(H.act[H.r]=H.act[H.r]||{})[g.id]={a:m.a,pred:m.pred};hSave();hRender();checkAll()}
 if(m.t==="judge"&&H.phase==="judge"&&m.r===H.r){(H.judge[H.r]=H.judge[H.r]||{})[g.id]=m.map;hSave();hRender();checkAll()}
}
function checkAll(){
 if(H.phase==="act"&&H.groups.every(g=>(H.act[H.r]||{})[g.id]))setTimeout(()=>{if(H.phase==="act")go("reveal")},900);
 if(H.phase==="judge"&&H.groups.every(g=>(H.judge[H.r]||{})[g.id]))setTimeout(()=>{if(H.phase==="judge")go("mirror")},900);
}
function go(ph){H.phase=ph;
 if(ph==="act")H.timerEnd=Date.now()+90000;
 if(ph==="judge")H.timerEnd=Date.now()+75000;
 if(ph==="reveal"){H.groups.forEach(g=>{(H.act[H.r]=H.act[H.r]||{});if(!H.act[H.r][g.id])H.act[H.r][g.id]={a:Math.floor(Math.random()*4),pred:STAMPS[Math.floor(Math.random()*4)].k,auto:1}})}
 if(ph==="mirror"){computeRound();H.mi=-1;H.order=H.groups.map(g=>g.id)}
 hSave();hRender()}
function computeRound(){const r=H.r,res={};
 H.groups.forEach(g=>{const counts={hero:0,cold:0,inept:0,show:0};
   H.groups.forEach(j=>{if(j.id===g.id)return;const m=(H.judge[r]||{})[j.id];if(m&&m[g.id])counts[m[g.id]]++});
   const mx=Math.max(...Object.values(counts));const top=mx>0?Object.keys(counts).filter(k=>counts[k]===mx):[];
   const pred=H.act[r][g.id].pred, acc=top.includes(pred);
   res[g.id]={counts,top,pred,acc,pts:(acc?2:0)+counts.hero,a:H.act[r][g.id].a}});
 H.res[r]=res}
function totals(){const t={};H.groups.forEach(g=>t[g.id]={pts:0,acc:0,hero:0,cracks:0,show:0,cold:0});
 Object.values(H.res).forEach(res=>Object.entries(res).forEach(([id,x])=>{if(!t[id])return;t[id].pts+=x.pts;t[id].acc+=x.acc?1:0;t[id].cracks+=x.acc?0:1;t[id].hero+=x.counts.hero;t[id].show+=x.counts.show;t[id].cold+=x.counts.cold}));return t}

     <div class="headline"><div class="mast"><span>明鏡日報</span><span>${R.y}</span></div><div class="hl">${hl}</div></div>
     <div class="tally">${STAMPS.map((s,i)=>`<div class="col"><span>${x.counts[s.k]}</span><div class="bar pop" style="height:${12+x.counts[s.k]/mx*120}px;background:${s.c};animation-delay:${i*.15}s"></div><span class="stamp" style="color:${s.c};width:62px;height:62px;font-size:18px">${s.t}</span></div>`).join("")}</div>
     <div class="verdict">他們以為自己會被寫成：<span class="stamp" style="color:${SK[x.pred].c};width:70px;height:70px;font-size:20px;vertical-align:middle">${SK[x.pred].t}</span><br>${x.acc?"猜中了！看清楚了別人眼中的自己。":"猜錯了——鏡子裡的自己，和別人看到的不一樣。"}　<b style="color:var(--red)">+${x.pts}</b></div></div></div>`}
 const last=H.mi>=H.order.length-1;
 ctrl.innerHTML=last?`<button class="btn" id="go">${H.r<4?"下一年 ▶":"最終結算 ▶"}</button>`:`<button class="btn y" id="go">揭曉${H.mi<0?"第一組":"下一組"} ▶</button>`;
 ctrl.querySelector("#go").onclick=()=>{if(!last){H.mi++;hSave();hRender()}else if(H.r<4){H.r++;go("event")}else go("final")};
}
function hFinal(hm,ctrl){
 const t=totals();const rows=[...H.groups].sort((a,b)=>t[b.id].pts-t[a.id].pts);
 const best=k=>[...H.groups].sort((a,b)=>t[b.id][k]-t[a.id][k])[0];
 hm.innerHTML=`<div class="board"><div class="sfx" style="font-size:80px;text-align:center">FINAL!</div>
  ${rows.map((g,i)=>`<div class="box brow pop" style="animation-delay:${(rows.length-i)*.25}s"><span class="rk">#${i+1}</span><span class="dot" style="width:26px;height:26px;border-radius:50%;border:3px solid #161616;background:${g.color}"></span>
   <span class="nm">${esc(g.name)}<div class="sub">猜中 ${t[g.id].acc}/5 次 · 英雄 ×${t[g.id].hero} · 鏡子裂了 ${t[g.id].cracks} 次</div></span><span class="pts">${t[g.id].pts}</span></div>`).join("")}
  <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px">
   <span class="cap">🪞 最看得清自己：${esc(best("acc").name)}</span><span class="cap" style="background:#BFE0FF">🦸 全城英雄：${esc(best("hero").name)}</span><span class="cap" style="background:#FFC9C2">🎭 最會作秀：${esc(best("show").name)}</span></div></div>`;
 ctrl.innerHTML=`<button class="btn w" id="go">真相（報告最後再按）</button>`;ctrl.querySelector("#go").onclick=()=>go("truth");
}
function hTruth(hm,ctrl){
 const t=totals();const accAll=H.groups.reduce((s,g)=>s+t[g.id].acc,0),tot=H.groups.length*5;
 const rows=ROUNDS.map((R,r)=>{const cnt=[0,0,0,0];Object.values(H.act[r]||{}).forEach(x=>cnt[x.a]++);const mx=Math.max(...cnt);const top=R.acts.filter((a,i)=>cnt[i]===mx&&mx>0).map(a=>a.t).join("、")||"—";
   const heroA=(()=>{const h=[0,0,0,0];Object.values(H.res[r]||{}).forEach(x=>h[x.a]+=x.counts.hero);const m=Math.max(...h);return m>0?R.acts[h.indexOf(m)].t:"—"})();
   return `<tr><td><b>${R.y}</b><br>${R.t}</td><td>${top}</td><td>${heroA}</td><td>${R.acts.filter(a=>a.pa).map(a=>"<b>"+a.t+"</b>").join("、")}<br><span class="tiny">${PA_NOTE[r]}</span></td></tr>`}).join("");
 hm.innerHTML=`<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:24px;flex:1;min-height:0">
  <div style="display:flex;flex-direction:column;gap:12px"><div class="cap" style="font-size:26px;align-self:flex-start">你們經營的「交通局」，就是紐約與紐澤西港務局</div>
   <table class="truth"><tr><th>年份</th><th>全班最多部門選的</th><th>被蓋最多「英雄」的</th><th>真實的港務局</th></tr>${rows}</table></div>
  <div style="display:flex;flex-direction:column;gap:16px">
   <div class="box" style="padding:18px;text-align:center"><div class="tiny">全班押中「別人眼中的自己」</div><div class="sfx" style="font-size:90px">${Math.round(accAll/Math.max(1,tot)*100)}%</div><div class="tiny">形象（image）＝ 你<b>以為</b>別人怎麼看你，不一定是別人真的怎麼看你</div></div>
   <div class="box" style="padding:18px;display:flex;flex-direction:column;gap:10px;font-weight:900;font-size:21px;line-height:1.45">
    <div>① 你是誰，決定你看見什麼問題。<span class="tiny">認同＝濾網</span></div>
    <div>② 別人怎麼看你，決定你何時行動。<span class="tiny">形象＝鏡子</span></div>
    <div>③ 你做了什麼，最後改寫你是誰。<span class="tiny">調適＝循環</span></div></div></div></div>`;
 ctrl.innerHTML=`<button class="btn w" id="go" style="font-size:16px">開新的一局</button>`;ctrl.querySelector("#go").onclick=()=>{if(confirm("清除這局，重新開始？")){H=hNew();hSave();location.href=location.pathname+(LOCAL?"?local=1":"")}};
}
/* 代打（手機斷線或沒手機的組） */
function proxy(gid){const g=G(gid);if(!g)return;
 if(H.phase==="lobby"){if(!confirm(`移除「${g.name}」？`))return;
   const cid=connOf[gid];if(cid)net.send(cid,{t:"full",msg:"主持人把這一組移除了。重新整理頁面可以再加入。"});
   delete connOf[gid];H.groups=H.groups.filter(x=>x.id!==gid);hSave();hRender();return}
 if(H.phase==="act"){const R=ROUNDS[H.r];let a=null,p=null;
   const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box"><h2>代打：${esc(g.name)}</h2><p class="tiny">請該組口頭告訴你，再點選。</p>
   <div class="acts" style="grid-template-columns:repeat(4,1fr);margin-top:10px">${R.acts.map((x,i)=>`<button class="act" data-a="${i}">${icon(x.ic)}${x.t}</button>`).join("")}</div>
   <p style="margin-top:12px;font-weight:900">他們押注的頭條：</p><div class="sts" style="grid-template-columns:repeat(4,1fr)">${STAMPS.map(s=>`<button class="stbtn" data-p="${s.k}"><span class="ic" style="background:${s.c}"></span>${s.t}</button>`).join("")}</div>
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn w" id="x">取消</button><button class="btn" id="ok">送出</button></div></div>`;document.body.appendChild(m);
   m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{a=+b.dataset.a;m.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("sel",x===b))});
   m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{p=b.dataset.p;m.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("sel",x===b))});
   m.querySelector("#x").onclick=()=>m.remove();
   m.querySelector("#ok").onclick=()=>{if(a===null||!p)return;(H.act[H.r]=H.act[H.r]||{})[gid]={a,pred:p};m.remove();hSave();hRender();checkAll()}}
 else if(H.phase==="judge"){const R=ROUNDS[H.r];const map={};const others=H.groups.filter(x=>x.id!==gid);
   const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box"><h2>代打：${esc(g.name)} 當記者</h2>
   ${others.map(o=>`<div class="target" style="border-bottom:2px solid #161616"><div class="tt">${icon(R.acts[H.act[H.r][o.id].a].ic)}<span>${esc(o.name)}：${R.acts[H.act[H.r][o.id].a].t}</span></div>
   <div class="mini">${STAMPS.map(s=>`<button data-o="${o.id}" data-s="${s.k}">${s.t}</button>`).join("")}</div></div>`).join("")}
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn w" id="x">取消</button><button class="btn" id="ok">送出</button></div></div>`;document.body.appendChild(m);
   m.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{map[b.dataset.o]=b.dataset.s;m.querySelectorAll(`[data-o="${b.dataset.o}"]`).forEach(x=>{const on=x===b;x.classList.toggle("sel",on);x.style.background=on?SK[x.dataset.s].c:"#fff"})});
   m.querySelector("#x").onclick=()=>m.remove();
   m.querySelector("#ok").onclick=()=>{if(others.some(o=>!map[o.id]))return;(H.judge[H.r]=H.judge[H.r]||{})[gid]=map;m.remove();hSave();hRender();checkAll()}}
}
/* 傳給各組手機的狀態 */
function broadcast(){if(!net)return;
 H.groups.forEach(g=>{const id=connOf[g.id];if(!id)return;const R=ROUNDS[H.r];const t=totals();
   const v={t:"state",phase:H.phase,r:H.r,y:R.y,title:R.t,me:{id:g.id,name:g.name,color:g.color},score:t[g.id]?t[g.id].pts:0};
   if(H.phase==="act"){v.acts=R.acts.map(a=>({t:a.t,s:a.s,ic:a.ic}));v.done=!!(H.act[H.r]||{})[g.id]}
   if(H.phase==="judge"){v.targets=H.groups.filter(o=>o.id!==g.id).map(o=>{const a=R.acts[H.act[H.r][o.id].a];return {id:o.id,name:o.name,color:o.color,t:a.t,ic:a.ic}});v.done=!!(H.judge[H.r]||{})[g.id]}
   if(H.phase==="mirror"){const idx=H.order.indexOf(g.id);if(idx>=0&&idx<=H.mi)v.res=H.res[H.r][g.id];v.mine=R.acts[H.act[H.r][g.id].a].t}
   if(H.phase==="final"||H.phase==="truth"){const rows=[...H.groups].sort((a,b)=>t[b.id].pts-t[a.id].pts);v.rank=rows.findIndex(x=>x.id===g.id)+1;v.n=H.groups.length;v.tot=t[g.id]}
   net.send(id,v)})}

/* =====================================================================
   各組手機
   ===================================================================== */
let P={gid:null,st:null,sel:{},jmap:{},key:""},cnet;
const PKEY="headline-gid-"+ROOM;
function startPlayer(){
 document.getElementById("player").style.display="flex";
 try{P.gid=sessionStorage.getItem(PKEY)}catch(e){}
 pRender();
 cnet=ClientNet(ROOM,m=>{
   if(m.t==="welcome"){P.gid=m.gid;try{sessionStorage.setItem(PKEY,m.gid)}catch(e){};P.pick=null;connNote("");pRender()}
   if(m.t==="pick"){P.pick=m.options;pRender()}
   if(m.t==="full"){P.full=m.msg;pRender()}
   if(m.t==="state"){const prev=P.st;P.st=m;const key=m.phase+"|"+m.r+"|"+(m.done?1:0)+"|"+(m.res?1:0);
     if(key!==P.key){if(!prev||prev.r!==m.r||prev.phase!==m.phase){P.sel={};P.jmap={};P.step=0}P.key=key;
       if(m.res&&!(prev&&prev.res))buzz(m.res.acc?[30]:[80,50,80]);pRender()}}
 },s=>{if(s==="open"){connNote("");cnet.send({t:"hello",gid:P.gid})}
   if(s==="lost")connNote("連線中斷，重新連線中…");
   if(s==="err")connNote("找不到主辦，重試中…（確認主辦畫面開著）");
   if(s==="nolib"){P.nolib=1;pRender()}});
 setInterval(()=>{if(!P.st&&!P.pick&&cnet)cnet.send({t:"hello",gid:P.gid})},4000);
}
function pRender(){
 const el=document.getElementById("player"),s=P.st;
 if(P.nolib){el.innerHTML=`<div class="lookup"><div class="sfx">OOPS!</div><p>手機無法載入連線元件。<br>請確認有網路，或請主持人幫你們「代打」。</p></div>`;return}
 if(P.full){el.innerHTML=`<div class="lookup"><div class="sfx">FULL!</div><p>${esc(P.full)}</p></div>`;return}
 if(P.pick&&!s){el.innerHTML=`<div class="lookup"><div class="sfx">RE-JOIN</div><p>遊戲已經開始了。<br>你們是哪一組？</p>${P.pick.map(o=>`<button class="btn" data-claim="${o.id}" style="background:${o.color};width:100%">${esc(o.name)}</button>`).join("")}</div>`;
   el.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>cnet.send({t:"hello",claim:b.dataset.claim}));return}
 if(!s){el.innerHTML=`<div class="lookup"><div class="sfx">HEADLINE!</div><p>連線到主辦中…<br><span class="pnote">房間 ${esc(ROOM)}</span></p></div>`;return}
 const top=`<div class="ptop" style="background:${s.me.color}"><span>${esc(s.me.name)}</span>${["lobby","final","truth"].includes(s.phase)?"":`<span class="yr">${s.y}</span>`}</div>`;
 let body="";
 const look=(big,t)=>`<div class="lookup"><div class="sfx">${big}</div><p>${t}</p><div class="cap">抬頭看大螢幕 ↑</div></div>`;
 if(s.phase==="lobby")body=`<div class="lookup"><div class="sfx">WELCOME!</div><p>你們這組是交通局的</p><div class="box" style="padding:10px 18px;font-size:30px;font-weight:900;background:${s.me.color};color:#fff">${esc(s.me.name)}</div><p>等主持人開始遊戲。<br><span class="pnote">整組共用這一支手機就好</span></p></div>`;
 if(s.phase==="event")body=look(s.y+"!","「"+s.title+"」——看看這一年發生了什麼。");
 if(s.phase==="reveal")body=look("BAM!","所有部門的行動同時翻開了！");
 if(s.phase==="act"){
   if(s.done)body=look("SENT!","已送出。等其他部門……");
   else if(!P.step){body=`<h2>① 這一年，你們部門要做什麼？</h2><p class="pnote">組內討論，選一張</p><div class="acts">${s.acts.map((a,i)=>`<button class="act ${P.sel.a===i?"sel":""}" data-a="${i}">${icon(a.ic)}${a.t}<small>${a.s}</small></button>`).join("")}</div>
     <button class="btn" id="nx" ${P.sel.a==null?"disabled":""}>下一步：押注 ▶</button>`}
   else{const a=s.acts[P.sel.a];body=`<div class="box" style="padding:10px;display:flex;align-items:center;gap:10px;font-weight:900"><span style="width:48px">${icon(a.ic)}</span>你們選了：${a.t}</div>
     <h2>② 你覺得明天報紙會把你們寫成什麼？</h2><p class="pnote">猜中「別人眼中的你」+2 分</p>
     <div class="sts">${STAMPS.map(x=>`<button class="stbtn ${P.sel.p===x.k?"sel":""}" data-p="${x.k}"><span class="ic" style="background:${x.c}"></span>${x.t}</button>`).join("")}</div>
     <div style="display:flex;gap:10px"><button class="btn w" id="bk">◀ 改行動</button><button class="btn" id="sd" style="flex:1" ${P.sel.p?"":"disabled"}>送出 ✓</button></div>`}}
 if(s.phase==="judge"){
   if(s.done)body=look("PRINTED!","印章都蓋好了。等其他記者……");
   else{const all=s.targets.every(t=>P.jmap[t.id]);body=`<h2>現在你們是記者！<br>給每個部門蓋一個頭條印章。</h2>
     ${s.targets.map(t=>`<div class="box target"><div class="tt">${icon(t.ic)}<span><span style="color:${t.color}">${esc(t.name)}</span><br>${t.t}</span></div>
      <div class="mini">${STAMPS.map(x=>`<button data-o="${t.id}" data-s="${x.k}" class="${P.jmap[t.id]===x.k?"sel":""}" style="${P.jmap[t.id]===x.k?"background:"+x.c:""}">${x.t}</button>`).join("")}</div></div>`).join("")}
     <button class="btn" id="js" ${all?"":"disabled"}>送去印刷 ✓</button>`}}
 if(s.phase==="mirror"){
   if(!s.res)body=look("MIRROR…","主持人正在一組一組揭曉。<br>你們做了：「"+esc(s.mine||"")+"」");
   else{const x=s.res;body=`<div class="box res"><div>${mirror(x.acc?0:3,150,x.acc)}</div><div class="sfx" style="color:${x.acc?"var(--yel)":"var(--red)"}">${x.acc?"SHINE!":"KRAK!"}</div>
     <p style="font-weight:900;font-size:18px">別人把你們寫成：${x.top.length?x.top.map(k=>`<span class="stamp" style="color:${SK[k].c};width:58px;height:58px;font-size:16px;margin:0 3px">${SK[k].t}</span>`).join(""):"（沒人注意）"}</p>
     <p style="font-weight:700">你們以為：<b>${SK[x.pred].t}</b></p><p class="cap">本回合 +${x.pts}　·　累計 ${s.score}</p></div>${look("","等下一年")}`}}
 if(s.phase==="final"||s.phase==="truth"){const t=s.tot;body=`<div class="lookup"><div class="sfx">#${s.rank}</div><p>${esc(s.me.name)}　${s.n} 組中第 ${s.rank} 名</p>
   <div class="box" style="padding:14px 18px;font-weight:900;line-height:1.7">總分 ${t.pts}<br>猜中別人眼中的自己 ${t.acc}/5 次<br>拿到「英雄」${t.hero} 次 · 鏡子裂了 ${t.cracks} 次</div>
   ${s.phase==="truth"?`<div class="cap">你們經營的交通局，就是紐約港務局。<br>答案在大螢幕上 ↑</div>`:`<div class="cap">真相，留到報告最後。</div>`}</div>`}
 el.innerHTML=top+`<div class="pbody">${body}</div>`;
 // bind
 el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{P.sel.a=+b.dataset.a;buzz(8);pRender()});
 const nx=el.querySelector("#nx");if(nx)nx.onclick=()=>{P.step=1;pRender()};
 const bk=el.querySelector("#bk");if(bk)bk.onclick=()=>{P.step=0;pRender()};
 el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{P.sel.p=b.dataset.p;buzz(8);pRender()});
 const sd=el.querySelector("#sd");if(sd)sd.onclick=()=>{cnet.send({t:"act",r:s.r,a:P.sel.a,pred:P.sel.p});buzz(20);sd.disabled=true;sd.textContent="送出中…"};
 el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{P.jmap[b.dataset.o]=b.dataset.s;buzz(8);const y=scrollY;pRender();scrollTo(0,y)});
 const js=el.querySelector("#js");if(js)js.onclick=()=>{cnet.send({t:"judge",r:s.r,map:P.jmap});buzz(20);js.disabled=true;js.textContent="印刷中…"};
}

if(IS_HOST)startHost();else startPlayer();
</script>
</body>
