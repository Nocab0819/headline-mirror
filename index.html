<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>北車大廳・鏡中人 HEADLINE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--cream:#F7EAD0;--paper:#FFF8E8;--ink:#161616;--red:#E23B2E;--yel:#FFD23F;--blue:#2E6FD8;--sky:#7CC6F0;--green:#2C9A55;
 --zh:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--comic:'Bangers','Noto Sans TC',Impact,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--zh);color:var(--ink);background:var(--cream);
 background-image:radial-gradient(circle,rgba(226,59,46,.16) 1.3px,transparent 1.8px);background-size:12px 12px;overflow-x:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
svg{display:block}
.box{background:var(--paper);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink)}
.sfx{font-family:var(--comic);color:var(--yel);letter-spacing:2px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.cap{background:var(--yel);border:3px solid var(--ink);padding:6px 12px;font-weight:900;display:inline-block}
.bubble{position:relative;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:14px 18px;font-weight:700}
.bubble:after{content:"";position:absolute;left:34px;bottom:-24px;border:12px solid transparent;border-top:16px solid var(--ink)}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:900;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 22px;font-size:20px;transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.y{background:var(--yel);color:var(--ink)}
.btn.w{background:#fff;color:var(--ink)}
.btn[disabled]{opacity:.35;pointer-events:none}
.stamp{display:inline-flex;align-items:center;justify-content:center;font-weight:900;border:4px solid currentColor;border-radius:50%;transform:rotate(-12deg);background:rgba(255,255,255,.85);flex:none}
.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.flip{animation:flip .6s cubic-bezier(.3,1.3,.5,1) both}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}}
.tiny{font-size:14px;font-weight:700;color:#555}
.spec{display:inline-flex;align-items:center;gap:6px;font-weight:900;border:3px solid var(--ink);padding:3px 10px;background:#fff}
.spec.leak{background:#FFC9C2}.spec.buck{background:#C9F0D6}

/* ================= HOST ================= */
#host{display:none;height:100vh;flex-direction:column;padding:18px 26px 14px;gap:14px}
.hhead{display:flex;align-items:center;gap:18px}
.logo{font-family:var(--comic);font-size:46px;line-height:1;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.logo small{font-family:var(--zh);font-weight:900;font-size:22px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;margin-left:6px}
.yearchip{font-family:var(--comic);font-size:40px;background:var(--ink);color:var(--yel);padding:2px 16px;transform:rotate(-3deg)}
.phase{font-weight:900;font-size:22px;background:#fff;border:3px solid var(--ink);padding:6px 14px}
.hspace{flex:1}
.timer{font-family:var(--comic);font-size:44px;min-width:110px;text-align:center}
.timer.low{color:var(--red)}
.hmain{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.hfoot{display:flex;gap:12px;align-items:stretch}
.gchip{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:18px;cursor:pointer;min-width:0}
.gchip .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);flex:none}
.gchip .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchip .st{font-family:var(--comic);font-size:22px}
.gchip.ok{background:var(--yel)}
.gchip.off{opacity:.5}
.gchip .sc{font-family:var(--comic);font-size:26px}
.gchip .cards{font-size:15px;letter-spacing:-2px}
.panels{display:grid;grid-template-columns:1.9fr 1fr 1fr;gap:20px;flex:1;min-height:0}
.panel{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.panel:nth-child(1){padding:0;background:#CFEAFB}
.panel:nth-child(3){background:#FFE9A8 radial-gradient(circle,rgba(226,59,46,.25) 1.8px,transparent 2.4px) 0 0/14px 14px}
.panel .cap{position:absolute;left:-4px;top:-4px;font-size:22px;max-width:92%;text-align:left;line-height:1.4;z-index:2}
.panel .scene{width:100%;height:100%;display:flex;align-items:center}
.panel .scene svg{width:100%;height:100%}
.panel .bubble{font-size:26px;line-height:1.45;max-width:94%}
.panel .who{margin-top:30px;font-weight:900;font-size:20px}
.panel .big{font-size:96px;line-height:1.05}
.panel .foot{position:absolute;left:auto;top:auto;right:-4px;bottom:-4px;font-size:20px;text-align:left;max-width:90%;z-index:2}
.newsmini{background:#EDE3CC;border:3px solid var(--ink);padding:14px 18px;transform:rotate(-2deg);max-width:94%}
.newsmini b{display:block;font-size:14px;letter-spacing:4px;border-bottom:3px double var(--ink);padding-bottom:4px;margin-bottom:8px}
.newsmini div{font-weight:900;font-size:34px;line-height:1.25}
.lobby{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;flex:1;min-height:0}
.lobby .qrbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#qr{background:#fff;padding:12px;border:4px solid var(--ink)}
#qr img,#qr canvas{display:block;width:300px;height:300px}
.url{font-weight:900;font-size:18px;word-break:break-all;text-align:center}
.rules{padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.rules h2{font-family:var(--comic);font-size:44px;color:var(--blue);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;letter-spacing:1px}
.rules .r{display:flex;gap:14px;align-items:flex-start;font-size:20px;font-weight:700;line-height:1.45}
.rules .r i{font-style:normal;font-family:var(--comic);font-size:28px;background:var(--red);color:#fff;border:3px solid var(--ink);width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center}
.stamps{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.center h1{font-size:54px;font-weight:900;line-height:1.25}
.center p{font-size:24px;font-weight:700}
.qpanel{display:grid;grid-template-columns:380px 1fr;gap:22px;flex:1;min-height:0}
.qbox{padding:20px;display:flex;flex-direction:column;gap:12px}
.qbox .rc{font-size:20px;font-weight:700;line-height:1.55}
.qright{display:flex;flex-direction:column;gap:16px;min-height:0}
.qtitle{font-weight:900;font-size:30px}
.qtitle span{background:var(--red);color:#fff;padding:2px 10px;border:3px solid var(--ink);margin-right:8px}
.opts4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1;min-height:0}
.ocard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 12px;gap:8px;position:relative}
.ocard .L{position:absolute;left:-4px;top:-4px;font-family:var(--comic);font-size:30px;background:var(--yel);border:3px solid var(--ink);width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.ocard .art{width:62%;max-width:170px}
.ocard .t{font-weight:900;font-size:26px;line-height:1.3}
.statusrow{display:flex;gap:16px;align-items:center;justify-content:center}
.grid{display:grid;gap:18px;flex:1;min-height:0}
.card{display:flex;flex-direction:column;align-items:center;padding:14px 12px 16px;text-align:center;position:relative;min-height:0}
.card .dept{font-weight:900;font-size:20px;color:#fff;border:3px solid var(--ink);padding:3px 12px;margin-top:-30px;margin-bottom:6px}
.card .art{width:48%;max-width:120px}
.card .t{font-weight:900;font-size:23px;line-height:1.3;margin-top:6px}
.card .bam{position:absolute;right:-14px;top:-22px;font-size:40px;transform:rotate(12deg)}
.mirrorstage{flex:1;display:grid;grid-template-columns:1fr 1.25fr;gap:30px;min-height:0;align-items:center}
.mleft{display:flex;flex-direction:column;align-items:center;gap:12px}
.mright{display:flex;flex-direction:column;gap:14px}
.headline{background:#EDE3CC;border:4px solid var(--ink);padding:16px 22px;box-shadow:7px 7px 0 var(--ink);transform:rotate(-1.5deg)}
.headline .mast{display:flex;justify-content:space-between;border-bottom:4px double var(--ink);padding-bottom:4px;font-weight:900;letter-spacing:4px}
.headline .hl{font-weight:900;font-size:42px;line-height:1.2;margin-top:8px}
.tally{display:flex;gap:14px;align-items:flex-end}
.tally .col{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900}
.tally .bar{width:70px;border:3px solid var(--ink)}
.verdict{font-size:24px;font-weight:900;line-height:1.5}
.events{display:flex;gap:12px;flex-wrap:wrap}
.events .ev{font-weight:900;font-size:20px;border:3px solid var(--ink);padding:6px 12px;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.events .ev.leak{background:#FFC9C2}.events .ev.buck{background:#C9F0D6}
.board{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;max-width:1100px;margin:0 auto;width:100%}
.brow{display:flex;align-items:center;gap:16px;padding:5px 16px;font-size:21px;font-weight:900}
.brow .rk{font-family:var(--comic);font-size:34px;width:50px}
.brow .nm{flex:1}
.brow .pts{font-family:var(--comic);font-size:38px}
.brow .sub{font-size:14px;font-weight:700;color:#444}
table.truth{width:100%;border-collapse:collapse;font-size:20px;background:var(--paper)}
table.truth td,table.truth th{border:3px solid var(--ink);padding:9px 12px;text-align:left;vertical-align:top}
table.truth th{background:var(--ink);color:var(--yel);font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{padding:22px;max-width:760px;width:92%;max-height:90vh;overflow:auto}
.ctrl{display:flex;gap:12px;align-items:center}
.howto{position:fixed;inset:0;z-index:80;background:var(--cream);background-image:radial-gradient(circle,rgba(46,111,216,.18) 1.4px,transparent 2px);background-size:14px 14px;display:flex;flex-direction:column;padding:30px 50px;gap:20px}
.howto .pg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.howto .pg h1{font-family:var(--comic);font-size:84px;line-height:1;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.howto .pg h2{font-size:44px;font-weight:900;line-height:1.3;margin-top:10px}
.howto .pg p{font-size:26px;font-weight:700;line-height:1.6;margin-top:14px}
.howto .vis{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;min-height:60%}
.howto .nav{display:flex;align-items:center;gap:16px}
.howto .dots{flex:1;display:flex;gap:10px;justify-content:center}
.howto .dots i{width:16px;height:16px;border:3px solid var(--ink);border-radius:50%;background:#fff}
.howto .dots i.on{background:var(--red)}
.ptsrow{display:flex;gap:14px;align-items:center;font-weight:900;font-size:28px}

/* ================= PLAYER ================= */
#player{display:none;max-width:480px;margin:0 auto;min-height:100vh;flex-direction:column;padding:14px 16px 28px}
.ptop{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-weight:900;font-size:20px}
.ptop .yr{margin-left:auto;font-family:var(--comic);font-size:28px;color:var(--yel);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.pq{margin-top:12px;background:#fff;border:3px solid var(--ink);padding:10px 12px;font-size:14px;font-weight:700;line-height:1.55}
.pq b{display:block;font-size:16px;font-weight:900}
.pbody{flex:1;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.pbody h2{font-size:22px;font-weight:900;line-height:1.35}
.lookup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.lookup .sfx{font-size:60px}
.lookup p{font-weight:700;font-size:17px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);text-align:center;font-weight:900;font-size:16px;line-height:1.3;position:relative}
.act svg{width:58%;max-width:84px}
.act small{font-weight:700;font-size:12px;color:#555}
.act .L{position:absolute;left:-3px;top:-3px;font-family:var(--comic);font-size:20px;background:var(--yel);border:3px solid var(--ink);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.act.sel{background:var(--yel);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stbtn{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:19px;text-align:left}
.stbtn small{display:block;font-size:12px;color:#555}
.stbtn.sel{background:var(--yel);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.stbtn .ic{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);flex:none}
.target{padding:12px;display:flex;flex-direction:column;gap:10px}
.target .tt{display:flex;align-items:center;gap:10px;font-weight:900}
.target .tt svg{width:52px;height:52px;flex:none}
.target .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.target .mini button{border:3px solid var(--ink);background:#fff;font-weight:900;font-size:16px;padding:8px 0}
.target .mini button.sel{color:#fff}
.target .mini button[disabled]{opacity:.25}
.leakbtn{border:3px dashed var(--ink);padding:6px;font-weight:900;font-size:14px;background:#fff}
.leakbtn.on{background:var(--red);color:#fff;border-style:solid}
.res{padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.res .sfx{font-size:52px}
.pnote{font-size:13px;color:#555;font-weight:700;text-align:center}
.prules{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:15px;font-weight:700;line-height:1.55}
.prules h3{font-family:var(--comic);font-size:28px;color:var(--blue);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;letter-spacing:1px}
.prules .row{display:flex;gap:8px;align-items:flex-start}
.prules .row i{font-style:normal;font-family:var(--comic);background:var(--red);color:#fff;border:2px solid var(--ink);min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
.conn{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:6px 12px;font-weight:700;display:none;z-index:90}

/* v4 visuals */
.hmain::before{content:"";position:absolute;inset:-10px;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(22,22,22,.10) 1.6px,transparent 1.8px);background-size:14px 14px}
.burstbg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.burstbg svg{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;transform:translate(-50%,-50%);animation:spin 80s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.onburst{position:relative;z-index:1}
.news{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;position:relative}
.news .tv{position:relative;z-index:1;background:#161616;border:6px solid #161616;box-shadow:10px 10px 0 #161616;border-radius:18px;padding:14px}
.news .tv svg{display:block;width:100%;height:auto;border-radius:8px}
.news .card{position:relative;z-index:1;background:var(--paper);border:5px solid #161616;box-shadow:10px 10px 0 #161616;padding:26px 30px;display:flex;flex-direction:column;gap:14px}
.news .flash{font-family:var(--comic);font-size:44px;background:var(--red);color:#fff;padding:2px 18px;align-self:flex-start;transform:rotate(-2deg);border:4px solid #161616;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#161616;color:var(--yel)}}
.news h1{font-size:58px;line-height:1.15;margin:0}
.news .d{font-size:27px;font-weight:700;line-height:1.5}
.news .rule{background:var(--yel);border:4px solid #161616;padding:12px 16px;font-size:26px;font-weight:900}
.ticker{position:absolute;left:-28px;right:-28px;bottom:-14px;height:46px;background:var(--red);border-top:4px solid #161616;border-bottom:4px solid #161616;overflow:hidden;z-index:2}
.ticker div{white-space:nowrap;color:#fff;font-weight:900;font-size:24px;line-height:38px;animation:tick 22s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.evstrip{display:flex;align-items:center;gap:12px;background:#161616;color:#fff;border:3px solid #161616;padding:6px 14px;font-weight:900;font-size:20px;margin-bottom:10px}
.evstrip b{background:var(--red);padding:0 8px;font-family:var(--comic);letter-spacing:1px}
.evstrip span{color:var(--yel)}
.pev{background:#161616;color:#fff;padding:7px 10px;font-size:13px;font-weight:700;line-height:1.45;border-bottom:3px solid #161616}
.pev b{background:var(--red);padding:0 5px;margin-right:4px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;text-align:center}
.stage h1{font-size:64px;margin:0;line-height:1.2}
.stage .lead{font-size:28px;font-weight:700;max-width:1300px;line-height:1.55}
.kicker{font-family:var(--comic);font-size:30px;background:#161616;color:var(--yel);padding:2px 16px;letter-spacing:2px}
.podium{display:flex;align-items:flex-end;gap:22px;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .blk{border:5px solid #161616;box-shadow:8px 8px 0 #161616;width:220px;display:flex;align-items:flex-start;justify-content:center;font-family:var(--comic);font-size:64px;color:#fff;-webkit-text-stroke:2px #161616;padding-top:10px}
.pod .nm{font-size:26px;font-weight:900}
.pod .pt{font-family:var(--comic);font-size:44px}
.restlist{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.restlist .box{padding:8px 16px;font-weight:900;font-size:22px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:100%;max-width:1500px}
.agcard{border:5px solid #161616;box-shadow:8px 8px 0 #161616;background:var(--paper);text-align:left;overflow:hidden}
.agcard .hd{color:#fff;font-weight:900;font-size:24px;padding:8px 14px;border-bottom:4px solid #161616}
.agcard .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.agcard .ag{font-size:30px;font-weight:900}
.agcard .meter{display:flex;gap:6px}.agcard .meter i{width:26px;height:26px;border:3px solid #161616;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
.agcard .meter i.on{background:var(--yel)}
.awards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;width:100%;max-width:1600px}
.award{border:5px solid #161616;box-shadow:8px 8px 0 #161616;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}

function HostNet(room,onMsg,onClose,onReady){
 if(LOCAL){const bc=new BroadcastChannel("hm-"+room);
   bc.onmessage=e=>{const m=e.data;if(m.to!=="host")return;if(m.data.t==="bye")onClose(m.from);else onMsg(m.from,m.data)};
   setTimeout(onReady,0);return {send:(id,d)=>bc.postMessage({to:id,data:d})}}
 const conns={};let peer;
 function start(tries=0){
   peer=new Peer(PEER_PREFIX+room,PEER_OPTS);
   peer.on("open",()=>{connNote("");onReady()});
   peer.on("connection",c=>{c.on("open",()=>{conns[c.peer]=c});c.on("data",d=>{conns[c.peer]=c;onMsg(c.peer,d)});c.on("close",()=>{delete conns[c.peer];onClose(c.peer)});c.on("error",()=>{})});
   peer.on("disconnected",()=>{connNote("重新連線中…");setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
   peer.on("error",e=>{if(e.type==="unavailable-id"&&tries<10){connNote("房間代碼被占用，重試中…");peer.destroy();setTimeout(()=>start(tries+1),2500)}
     else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){connNote("連線伺服器不穩，可點下方組別「代打」繼續")}});
 }
 if(typeof Peer==="undefined"){connNote("無法載入連線元件（沒有網路？）。可新增「沒手機的組」用代打進行。");setTimeout(onReady,0);return {send:()=>{}}}
 start();
 return {send:(id,d)=>{const c=conns[id];if(c&&c.open)try{c.send(d)}catch(e){}}};
}
function ClientNet(room,onMsg,onStatus){
 if(LOCAL){const me="c"+Math.random().toString(36).slice(2,8);const bc=new BroadcastChannel("hm-"+room);
   bc.onmessage=e=>{if(e.data.to===me)onMsg(e.data.data)};
   const api={send:d=>bc.postMessage({to:"host",from:me,data:d})};setTimeout(()=>onStatus("open"),0);
   addEventListener("pagehide",()=>api.send({t:"bye"}));return api}
 let peer,conn,alive=false;
 function connect(){peer=new Peer(PEER_OPTS);peer.on("open",dial);peer.on("error",e=>{onStatus("err");if(e.type==="peer-unavailable")setTimeout(dial,2500)});peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}})}
 function dial(){
   conn=peer.connect(PEER_PREFIX+room,{reliable:true});
   conn.on("open",()=>{alive=true;onStatus("open")});
   conn.on("data",onMsg);
   conn.on("close",()=>{alive=false;onStatus("lost");setTimeout(dial,2000)});
   conn.on("error",()=>{});
   setTimeout(()=>{if(!alive){try{conn.close()}catch(e){}}},8000)}
 if(typeof Peer==="undefined"){setTimeout(()=>onStatus("nolib"),0);return {send:()=>{}}}
 connect();
 setInterval(()=>{if(!alive&&peer&&peer.open)dial()},6000);
 return {send:d=>{if(conn&&conn.open)try{conn.send(d)}catch(e){}}};
}

const SFX=(()=>{let ac=null,on=true;try{on=localStorage.getItem("hall-sound")!=="off"}catch(e){}

 function tone(f,t0,d,type="square",v=.12,f2){const a=ctx();if(!a||!on)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);
   g.gain.setValueAtTime(v,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.02)}
 function noise(t0,d,v=.2,hp=800){const a=ctx();if(!a||!on)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);
   const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="highpass";f.frequency.value=hp;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0)}
 return {
  get on(){return on},toggle(){on=!on;try{localStorage.setItem("hall-sound",on?"on":"off")}catch(e){}if(on)this.ding()},
  unlock(){ctx()},
  ding(){tone(880,0,.25,"triangle",.18);tone(1320,.08,.3,"triangle",.12)},

  drum(){for(let i=0;i<14;i++)noise(i*.07,.06,.12,1500);tone(110,1.0,.35,"sawtooth",.18,55);noise(1.0,.4,.35,300)},
  shine(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.09,.35,"triangle",.12))},
  crack(){noise(0,.5,.45,2000);tone(220,0,.5,"sawtooth",.12,60)},

  whoosh(){noise(0,.8,.25,500);[523,784,1046,1568].forEach((f,i)=>tone(f,.3+i*.1,.4,"triangle",.1))},
  fanfare(){[523,523,523,659,784,659,784].forEach((f,i)=>tone(f,i*.14,.2,"square",.1));tone(1046,1.0,.8,"triangle",.14)},
  tick(){tone(1200,0,.05,"square",.05)}}})();

function computeRound(){const k=H.k,R=curR(),X=H.RES[k];const win=R.acts[X.win];
 const cnt={up:0,meh:0,down:0};Object.values(H.J[k]).forEach(j=>cnt[j.vote]++);

 const on=(id,f)=>{const b=el.querySelector(id);if(b)b.onclick=f};
 const keep=f=>{const y=scrollY;f();pRender();scrollTo(0,y)};
 el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>keep(()=>{P.sel.a=+b.dataset.a;buzz(8)}));
 on("#re",()=>{P.re=true;pRender()});
 on("#vs",()=>{P.re=false;cnet.send({t:"vote",k:s.k,a:P.sel.a});buzz(20);el.querySelector("#vs").disabled=true});
 el.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>keep(()=>{P.sel.p=b.dataset.pr;buzz(8)}));
 el.querySelectorAll("[data-vo]").forEach(b=>b.onclick=()=>keep(()=>{P.sel.v=b.dataset.vo;buzz(8)}));
 on("#js",()=>{cnet.send({t:"judge",k:s.k,pred:P.sel.p,vote:P.sel.v});buzz(20);el.querySelector("#js").disabled=true});
}

if(IS_HOST)startHost();else startPlayer();

</script>
</body>
</html>
